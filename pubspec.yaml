name: zuraffa_observability
description: OpenTelemetry capability for Zuraffa — tracer, failure reporter, telemetry hook, and the simulation span capture (optional companion package; issue #1661).
version: 7.3.2
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_observability
issue_tracker: https://github.com/arrrrny/zuraffa_observability/issues

environment:
  sdk: ^3.11.0

dependencies:
  opentelemetry: ^0.18.11
  logging: ^1.3.0
  zuraffa: ^7.3.2

dev_dependencies:
  test: ^1.33.0

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0

  zuraffa:
    path: ../zuraffa
